[tool.poetry]
name = "zeta-rerank"
version = "0.1.0"
description = "BGE Reranker Server using CrossEncoder"
authors = ["Zeta4Lab <zeta4lab@users.noreply.github.com>"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/zeta4lab/zeta-rerank"
repository = "https://github.com/zeta4lab/zeta-rerank"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
sentence-transformers = "^4.0.0"
torch = "^2.5.0"
transformers = "^4.47.0"
pydantic = "^2.10.0"

[tool.poetry.scripts]
zeta-rerank = "server:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
