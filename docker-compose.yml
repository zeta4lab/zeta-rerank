version: '3.8'

services:
  zeta-rerank:
    build: .
    ports:
      - "9046:9046"
    environment:
      - RERANK_MODEL=Qwen/Qwen3-Reranker-0.6B
      - RERANK_DEVICE=cpu
      - RERANK_PORT=9046
      - RERANK_MAX_LENGTH=512
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    restart: unless-stopped
